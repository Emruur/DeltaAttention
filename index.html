<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeltaAttention</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header .subtitle {
      font-size: 0.9rem;
      color: #666;
    }
    .actions {
      margin-left: auto;
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 500;
    }
    .btn-primary {
      background: #1a1a1a;
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ccc;
    }
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 2rem;
    }
    iframe {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 130px);
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      background: #fff;
    }
    footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <h1>DeltaAttention</h1>
    <span class="subtitle">Draft — Leiden University</span>
    <div class="actions">
      <a class="btn btn-secondary" href="https://github.com/Emruur/DeltaLLM-main">GitHub</a>
      <a class="btn btn-primary" href="Paper/builds/main.pdf" download>Download PDF</a>
    </div>
  </header>
  <div class="viewer">
    <iframe src="Paper/builds/main.pdf" title="DeltaAttention paper draft"></iframe>
  </div>
  <footer>Latest draft — updated on push to Snellius branch</footer>
</body>
</html>
