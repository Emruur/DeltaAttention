<!DOCTYPE html>

<meta charset="UTF-8">

<title>Antidiagonal Scoring</title>
<style>
    body {
        font-family: 'Times New Roman', Times, serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #ffffff;
        margin: 0;
    }
    .presentation-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
    }
    .diagram-section {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .grid-24 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border: 2px solid #000;
        width: 320px;
        height: 320px;
    }
    .block {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        border: 1px solid #000;
    }
    .cell {
        border: 1px solid #d3d3d3; /* Light grey grid lines */
        background-color: #e8e8e8; /* Default cell background */
        box-sizing: border-box;
    }
    .cell.teal {
        background-color: #009688;
        border-color: #009688; /* Remove border for colored cells to make them pop, or match color */
    }
    .cell.purple {
        background-color: #9c27b0;
        border-color: #9c27b0;
    }
    
    .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        border: 2px solid #000;
        width: 120px;
        height: 120px;
    }
    .block-small {
        border: 1px solid #000;
    }
    .block-small.teal {
        background-color: #009688;
    }
    .block-small.purple {
        background-color: #9c27b0;
    }

    .arrow {
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 40px; /* Align with grids visually */
    }

    .label {
        font-size: 22px;
        font-weight: bold;
        margin-top: 20px;
        text-align: center;
        line-height: 1.2;
    }

    /* Styles for the 3rd part */
    .block.full-teal .cell {
        background-color: #009688;
        border-color: #00897b; /* slightly darker border for visibility */
    }
    .block.full-grey .cell {
        background-color: #e8e8e8;
    }
</style>
</head>
